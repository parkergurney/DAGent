[[tasks]]
id = "doc-ids-consistency"
title = "Make missing-ID handling consistent across update/remove"
brief = """
When you call `update()` or `remove()` on a table and pass one or more document IDs, and one of those IDs doesn't actually exist, the call currently raises a `KeyError`.
But `get()` already handles missing IDs gracefully: it returns `None` for a single missing ID and an empty list for a list of IDs that don't match anything.

Make `update()` and `remove()` behave the same way: silently skip IDs that don't exist, and return only the list of IDs that were actually updated or removed.
If a request mixes existing and non-existing IDs, only the existing ones should be affected, and the operation should not raise or fail partway through.
"""
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task1_doc_ids_consistency.py -q"

[[tasks]]
id = "lru-cache-set-update"
title = "Fix the LRU cache's value update on existing keys"
brief = """
The LRU cache used internally for caching query results has a bug in its `set()` method: when you set a value for a key that's already in the cache, the cache correctly marks that key as recently used, but it never actually replaces the stored value; the old value is left in place.

Fix `set()` so that giving an existing key a new value actually replaces what's stored, in addition to updating its recency.
"""
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task2_lru_cache_set_update.py -q"

[[tasks]]
id = "lru-cache-falsy-values"
title = "Fix the LRU cache's handling of falsy cached values"
brief = """
The same cache has a subtler bug: it decides whether a key already exists by checking whether the currently cached value is truthy. That means a key whose cached value happens to be falsy (`0`, `False`, `\"\"`, etc.) gets treated as if it were missing entirely.
As a result, setting a new value for such a key takes the wrong code path, which corrupts the cache's least-recently-used ordering and its eviction behavior.

Make the "does this key already exist" check correct for falsy values too, independent of what value happens to be stored there.
Note that this only fully resolves once existing keys also get their value correctly replaced.
"""
depends_on = ["lru-cache-set-update"]
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task3_lru_cache_falsy_values.py -q"

[[tasks]]
id = "custom-document-class"
title = "Respect custom document classes consistently"
brief = """
A table's document class (the class used to represent a stored document, which also carries the document's ID) can be customized by subclassing. This is a documented extension point, meant to support things like a different document ID type.

However, several places in the insert/upsert code path that need to detect "this document already has an explicit ID assigned" check against the built-in default document class directly, instead of checking against whichever class the table was actually configured to use.
As a result, if a table is configured with a custom document class that is not a subclass of the built-in one, TinyDB fails to recognize documents that carry an explicit ID: inserting silently assigns a new auto-generated ID instead of honoring the one provided, and upserting can incorrectly claim that no ID was given at all.

Fix the ID-detection logic so it consistently respects whichever document class the table is configured to use, everywhere a document's explicit ID needs to be detected.
"""
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task4_document_class_isinstance.py -q"

[[tasks]]
id = "persist-empty-tables"
title = "Allow a table to persist even when empty"
brief = """
Creating a table currently has no effect on storage until at least one document is written to it, so a table created but never populated does not show up if you reopen the database. There's no way to create a table that is guaranteed to persist immediately, even with zero documents in it.

Add a way to create a table that is written to storage right away, so it shows up in the list of tables even before anything has been inserted into it, while tables created the normal way keep the current lazy behavior.
"""
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task5_persist_empty_tables.py -q"

[[tasks]]
id = "remove-doc-ids-priority"
title = "Make remove() prefer doc_ids over cond, like the other methods"
brief = """
`get()`, `contains()`, and `update()` all agree on the same rule when you pass both a query condition and a list of document IDs at once: the explicit IDs win, and the condition is ignored.
`remove()` is the odd one out: right now it checks the condition first, so passing both silently ignores the IDs you gave it and removes whatever the condition happens to match instead.

Make `remove()` follow the same precedence as the other methods: when both `cond` and `doc_ids` are given, `doc_ids` should be the one that's honored.
"""
hidden_cmd = "/Users/parkergurney/Development/agent-orchestrator/.venv/bin/python -m pytest hidden_tests/test_task6_remove_doc_ids_priority.py -q"
