schema_version = "1.4"

[task]
name = "agent-orchestrator/orchestrator-quality-claude"
version = "1.0.0"
description = "Claude-backed semantic-quality Harbor benchmark using recovered Arrow, JSONSchema, and TinyDB tasks"
keywords = ["agent-orchestration", "software-engineering", "quality", "benchmark"]

[metadata]
category = "agent-orchestration-quality"
hidden_evaluation = "tests/grader.py"
graph = "graph.json"

[agent]
timeout_sec = 1800
user = "harbor"

[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 2048

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 8192

[environment.env]
ORCH_AUTH_ENV_FILE = "/run/secrets/orchestrator-claude-auth.env"
ORCH_BACKEND = "anthropic"
ORCH_BACKEND_TRACK = "quality-claude"
ORCH_AUTH_MECHANISM = "subscription-oauth"
ORCH_WORKER_MODEL = "claude-sonnet-4-6"
ORCH_SUPERVISOR_MODEL = "claude-sonnet-4-6"
ORCH_MAX_CONCURRENCY = "4"
ORCH_CONTEXT_LENGTH = "32768"
ORCH_STALL_THRESHOLD_S = "300"
ORCH_WORKER_TIMEOUT_S = "1500"
ORCH_SDK_TIMEOUT_S = "300"
ORCH_SUPERVISOR_TIMEOUT_S = "120"
