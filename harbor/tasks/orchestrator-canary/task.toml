schema_version = "1.4"
artifacts = [
  "/logs/artifacts/base_sha.txt",
  "/logs/artifacts/candidate.patch",
  "/logs/artifacts/result.json",
  "/logs/artifacts/metrics.json",
]

[task]
name = "agent-orchestrator/orchestrator-canary"
version = "1.0.0"
description = "Small deterministic canary for the Harbor orchestrator adapter"
keywords = ["orchestration", "git", "canary"]

[metadata]
category = "agent-orchestration"
hidden_evaluation = "tests/grader.py"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 512

[environment]
network_mode = "public"
cpus = 2
memory_mb = 2048
storage_mb = 4096
