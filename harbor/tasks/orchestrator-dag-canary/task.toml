schema_version = "1.4"

[task]
name = "dagent/orchestrator-dag-canary"
version = "1.0.0"
description = "Dependency-aware Harbor benchmark task graph for comparing scheduler policies"
keywords = ["orchestration", "dependencies", "git", "benchmark"]

[metadata]
category = "agent-orchestration"
hidden_evaluation = "tests/grader.py"
graph = "graph.json"

[agent]
timeout_sec = 3600
user = "harbor"

[verifier]
timeout_sec = 180
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 512

[environment]
network_mode = "public"
cpus = 2
memory_mb = 2048
storage_mb = 4096

[environment.env]
# Ollama exposes an Anthropic-compatible endpoint. These are non-secret
# values; this experiment does not use an Anthropic API key.
ANTHROPIC_AUTH_TOKEN = "ollama"
ANTHROPIC_API_KEY = ""
ANTHROPIC_BASE_URL = "http://host.docker.internal:11434"
ORCH_BACKEND = "ollama"
ORCH_WORKER_MODEL = "qwen3-coder:30b"
ORCH_SUPERVISOR_MODEL = "qwen3-coder:30b"
ORCH_MAX_CONCURRENCY = "2"
ORCH_CONTEXT_LENGTH = "32768"
ORCH_WORKER_TIMEOUT_S = "1200"

