[project]
name = "dagent"
version = "0.0.1"
description = "Deterministic orchestration daemon that runs a team of Claude Code sessions over a task DAG."
requires-python = ">=3.12"
# claude-agent-sdk drives real worker sessions; pydantic gives the supervisor
# its closed-enum action schema. Everything else - control loop through verify
# gate - is sqlite3, tomllib, dataclasses, and asyncio.
dependencies = ["claude-agent-sdk>=0.2.123", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dagent = "dagent.cli:main"
dagent-verify-gate = "dagent.verify.cli:main"
dagent-supervisor-replay = "dagent.supervisor.replay:main"
dagent-report = "dagent.experiment:main"
dagent-experiment = "dagent.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
