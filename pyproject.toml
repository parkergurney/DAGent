[project]
name = "dagent"
version = "0.0.1"
description = "Deterministic orchestration daemon for Claude Code worker sessions. Working name."
requires-python = ">=3.12"
# M3 added claude-agent-sdk for real Agent SDK worker sessions. M4 adds
# pydantic for the supervisor's closed-enum action schema (design.md section
# 6 specs these as pydantic BaseModels directly) -- everything else, control
# loop through verify gate, is still sqlite3/tomllib/dataclasses/asyncio.
dependencies = ["claude-agent-sdk>=0.2.123", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dagent = "dagent.cli:main"
dagent-verify-gate = "dagent.verify.cli:main"
dagent-supervisor-replay = "dagent.supervisor.replay:main"
dagent-report = "dagent.experiment:main"
dagent-experiment = "dagent.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
