[project]
name = "agent-orchestrator"
version = "0.0.1"
description = "Deterministic orchestration daemon for Claude Code worker sessions. Working name."
requires-python = ">=3.12"
# M3 added claude-agent-sdk for real Agent SDK worker sessions. M4 adds
# pydantic for the supervisor's closed-enum action schema (design.md section
# 6 specs these as pydantic BaseModels directly) -- everything else, control
# loop through verify gate, is still sqlite3/tomllib/dataclasses/asyncio.
dependencies = ["claude-agent-sdk>=0.2.123", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
orchestrator = "orchestrator.cli:main"
verify-gate = "orchestrator.verify.cli:main"
supervisor-replay = "orchestrator.supervisor.replay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
