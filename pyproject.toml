[project]
name = "agent-orchestrator"
version = "0.0.1"
description = "Deterministic orchestration daemon for Claude Code worker sessions. Working name."
requires-python = ">=3.12"
# M0 is the storage layer only: stdlib (sqlite3, tomllib, dataclasses) + a
# vendored ULID. Runtime deps (claude-agent-sdk, pydantic, ...) arrive with the
# milestones that need them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
